name: stroom-ingest

# Fase 3 — operationele stroom-ingestie + hindcast-historie.
# Elk uur: nieuwe Matroos-runs inlezen, hindcast bijwerken, oude runs opruimen.
# Matroos publiceert 8 runs/dag met ~4,5u vertraging; uurlijks pollen pikt elke
# run op en is zelfherstellend na een korte uitval (lookback in stroom_cron.py).

on:
  schedule:
    - cron: "0 * * * *"        # elk heel uur (UTC)
  workflow_dispatch: {}         # handmatig te starten

# Nooit twee ingesties tegelijk (idempotent, maar overlap heeft geen zin).
concurrency:
  group: stroom-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Twee tegelgroepen, ELK een eigen job met eigen 55-min budget:
    #   inshore  = 100 m geul/estuarium-tegels (wad/zeeland/rijnmond)
    #   offshore = 300 m open-Noordzee-strook (nz-zuid/nz-noord)
    # Waarom gesplitst: in één cyclus staan de offshore-tegels achteraan; bij een
    # koude start of achterstand slurpt het bijwerken van de geul-tegels het hele
    # uur op en worden de offshore-tegels nooit bereikt (het duurde ~3 dagen voordat
    # de cron ze voor het eerst haalde). Een eigen job garandeert offshore z'n tijd.
    #
    # max-parallel: 1 -> STRIKT sequentieel (niet parallel): finalize_hindcast_punten
    # doet read-modify-write op één dag-parquet per dag, dus twee tegelijk lopende
    # jobs zouden elkaars hindcast-punten overschrijven. fail-fast: false -> offshore
    # draait ook als inshore faalt of z'n timeout raakt (anders opnieuw verhongering).
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        group: [inshore, offshore]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Install deps
        run: pip install -r ingest/requirements.txt

      # Een gloednieuwe tegel krijgt zijn grid deze cyclus geüpsert en zijn
      # puntreeksen de volgende — zelfherstellend, geen aparte seed-stap nodig.
      - name: Ingest ${{ matrix.group }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
        run: python -m ingest.stroom_cron --${{ matrix.group }}

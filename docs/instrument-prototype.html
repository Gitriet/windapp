<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windapp — instrument</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#1B242A; --screen:#141C21; --bezel:#0C1215;
    --label:#AEBAC0; --label-dim:#5E6E76;
    --hair:#2E3C43; --hair-2:#243036;
    --led:#FF2E1B; --led-dim:#3A140D;
    --gust:#E5952F;
    --water:#3E90AD; --water-lit:#9FD4E6; --water-dim:#1B3640;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0A0F12;-webkit-font-smoothing:antialiased}
  body{font-family:"Barlow",sans-serif;display:flex;justify-content:center;padding:16px 12px 32px}
  .lab{font-family:"Barlow Semi Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--label);font-size:10px;font-weight:600}
  .lab-dim{color:var(--label-dim)}

  .device{width:100%;max-width:420px;background:linear-gradient(#12191D,#0C1215);
    border-radius:22px;padding:6px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04)}
  .panel{background:radial-gradient(130% 70% at 50% 0%,#1F2A31 0%,#1B242A 48%,#161E23 100%);
    border-radius:18px;border:1px solid #2A363D;padding:14px 14px 16px;color:var(--label);
    display:flex;flex-direction:column;gap:12px}

  /* locatie */
  .loc{display:flex;align-items:center;gap:10px;background:var(--screen);border:1px solid var(--hair);border-radius:11px;padding:10px 14px}
  .loc .name{flex:1;min-width:0;font-family:"IBM Plex Mono",monospace;font-size:13px;color:#C8D0D4;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loc .name .reg{color:var(--label-dim)}
  .loc .chev{margin-left:auto;color:var(--label-dim);font-size:12px}

  /* instrumentrij */
  .inst{display:flex;align-items:center;gap:4px}
  .wbar,.tbar{flex:0 0 74px}
  .rose{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
  .rose svg{max-width:216px}
  svg{display:block;width:100%;height:auto}

  /* LED vlakken */
  .cells{display:flex;border:1px solid var(--hair);border-radius:11px;overflow:hidden;background:var(--screen)}
  .cell{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;gap:9px;align-items:flex-start}
  .cell + .cell{border-left:1px solid var(--hair)}

  /* 7-daagse strip */
  .week{display:flex;border:1px solid var(--hair);border-radius:11px;overflow:hidden;background:var(--screen)}
  .wd{flex:1;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .wd + .wd{border-left:1px solid var(--hair-2)}
  .wd .day{font-family:"Barlow Semi Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;font-size:11px;font-weight:600;color:var(--label)}
  .wd.now{background:rgba(255,255,255,.05)}
  .wd.now .day{color:#E7EDEF}
  .wd .t{font-size:14px;font-weight:600;color:#E7EDEF;font-variant-numeric:tabular-nums}
  .wd .k{font-size:12px;color:var(--label-dim);font-family:"IBM Plex Mono",monospace;display:flex;align-items:center;gap:2px}
  .wd .arr{display:flex;align-items:center;justify-content:center}
  .wd .wk-big{font-size:16px;font-weight:600;color:#E7EDEF;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:2px}
  .wd .wk-big em{font-style:normal;font-size:9px;color:var(--label-dim)}
  .wd .t-dim{font-size:11px;color:var(--label-dim);font-family:"IBM Plex Mono",monospace}

  .barTitle{fill:var(--label);font-family:"Barlow Semi Condensed",sans-serif;letter-spacing:.14em;font-size:15px;font-weight:600}
  .barUnit{fill:var(--label-dim);font-family:"IBM Plex Mono",monospace;font-size:13px}
  .barNum{fill:var(--label-dim);font-family:"IBM Plex Mono",monospace;font-size:13px}
</style>
</head>
<body>
<div class="device">
 <div class="panel">

  <div class="loc">
    <span class="name">Hoorn (Terschelling) <span class="reg">· Waddenzee</span></span>
    <span class="chev">▾</span>
  </div>

  <div class="inst">
    <div class="wbar"><svg id="wbar"></svg></div>
    <div class="rose"><svg id="rose" viewBox="0 0 200 200"></svg></div>
    <div class="tbar"><svg id="tbar"></svg></div>
  </div>

  <div class="cells">
    <div class="cell"><span class="lab">Wind knopen</span><span id="ledKn"></span></div>
    <div class="cell"><span class="lab">Temp °C</span><span id="ledT"></span></div>
    <div class="cell"><span class="lab">Druk hPa</span><span id="ledP"></span></div>
  </div>

  <div class="week" id="dayprog"></div>

  <div class="week" id="tideday"></div>

  <div class="week" id="week"></div>

 </div>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
function E(p,t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e;}

/* ---------- 7-segment LED ---------- */
const SEG={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':''};
function segPath(id){const th=8,L=14,R=86,T=16,M=90,B=164;
  const H=cy=>`M${L},${cy} l${th},-${th} L${R-th},${cy-th} L${R},${cy} L${R-th},${cy+th} L${L+th},${cy+th} Z`;
  const V=(cx,y1,y2)=>`M${cx},${y1} l${th},${th} L${cx+th},${y2-th} L${cx},${y2} L${cx-th},${y2-th} L${cx-th},${y1+th} Z`;
  return {a:H(T),g:H(M),d:H(B),f:V(L,T+4,M-4),b:V(R,T+4,M-4),e:V(L,M+4,B-4),c:V(R,M+4,B-4)}[id];}
function led(str,h){const dh=180,dw=100,adv=118,dotW=42;let x=0,parts=[];
  for(const ch of str){
    if(ch==='.'){parts.push(`<circle cx="${x+16}" cy="${dh-14}" r="12" class="lon"/>`);x+=dotW;continue;}
    const segs=SEG[ch]||'';
    for(const s of 'abcdefg')parts.push(`<path d="${segPath(s)}" class="${segs.includes(s)?'lon':'loff'}" transform="translate(${x},0)"/>`);
    x+=adv;}
  const w=x-(str.endsWith('.')?dotW:adv)+dw;
  return `<svg viewBox="0 0 ${w} ${dh}" style="height:${h}px;width:auto;overflow:visible">
    <defs><filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <style>.lon{fill:var(--led);filter:url(#g)}.loff{fill:var(--led-dim)}</style>${parts.join('')}</svg>`;}
document.getElementById('ledKn').innerHTML=led('8.3',30);
document.getElementById('ledT').innerHTML=led('20',30);
document.getElementById('ledP').innerHTML=led('1023',30);

/* ---------- verticale schaalbalk ---------- */
function bar(svg,cfg){
  const VW=96,VH=300; svg.setAttribute('viewBox',`0 0 ${VW} ${VH}`);
  const yTop=48,yBot=262,H=yBot-yTop;
  const left=cfg.side==='left', barW=24;
  const barX=left?VW-6-barW:6;
  const numX=left?barX-7:barX+barW+7;
  const anchor=left?'end':'start';
  E(svg,'text',{x:VW/2,y:20,'text-anchor':'middle',class:'barTitle'},cfg.title);
  if(cfg.unit)E(svg,'text',{x:VW/2,y:VH-8,'text-anchor':'middle',class:'barUnit'},cfg.unit);
  const n=28,gap=2,segH=(H-(n-1)*gap)/n;
  const r=Math.max(0,Math.min(1,(cfg.value-cfg.min)/(cfg.max-cfg.min)));
  const lit=Math.max(1,Math.round(r*n));
  for(let i=0;i<n;i++){
    const y=yBot-(i+1)*segH-i*gap, on=i<lit, marker=(i===lit-1);
    let fill=on?cfg.seg:'#243038';
    if(marker&&cfg.mark)fill=cfg.mark;
    const rect=E(svg,'rect',{x:barX,y,width:barW,height:segH,rx:2,fill});
    if(on)rect.setAttribute('style',`filter:drop-shadow(0 0 3px ${cfg.glow})`);
  }
  (cfg.ticks||[]).forEach(t=>{
    const y=yBot-((t.v-cfg.min)/(cfg.max-cfg.min))*H;
    E(svg,'text',{x:numX,y:y+4,'text-anchor':anchor,class:'barNum'},t.label);
  });
  if(cfg.cap){const ax=barX+barW/2;
    E(svg,'path',{d:`M${ax},${yTop-10} L${ax-5},${yTop-2} L${ax+5},${yTop-2} Z`,fill:cfg.mark||cfg.seg,style:`filter:drop-shadow(0 0 3px ${cfg.glow})`});}
  if(cfg.rising){const ax=barX+barW/2, y=yBot-r*H;
    E(svg,'path',{d:`M${ax},${y-16} L${ax-5},${y-8} L${ax+5},${y-8} Z`,fill:cfg.mark,style:`filter:drop-shadow(0 0 4px ${cfg.glow})`});}
}
bar(document.getElementById('wbar'),{side:'left',title:'WIND',unit:'8.3 kn',min:0,max:40,value:8.3,
  seg:'var(--led)',mark:'var(--gust)',glow:'rgba(255,46,27,.55)',cap:true,
  ticks:[{v:0,label:'0'},{v:10,label:'10'},{v:20,label:'20'},{v:30,label:'30'},{v:40,label:'40'}]});
bar(document.getElementById('tbar'),{side:'right',title:'GETIJ',unit:'HW 09:40',min:-110,max:100,value:82,
  seg:'var(--water)',mark:'var(--water-lit)',glow:'rgba(63,144,173,.6)',rising:true,
  ticks:[{v:100,label:'HW'},{v:-110,label:'LW'}]});

/* ---------- kompasroos ---------- */
(function(){
  const c=document.getElementById('rose'),cx=100,cy=100,windDir=45;
  E(c,'circle',{cx,cy,r:94,fill:'none',stroke:'var(--hair)','stroke-width':1});
  for(let a=0;a<360;a+=10){
    const principal=(a%45===0);
    const dd=Math.abs(((a-windDir+540)%360)-180);
    const lit=dd<=5;
    const near=dd<=15;
    const rad=(a-90)*Math.PI/180, rOut=90, rIn=principal?76:83;
    const x1=cx+rOut*Math.cos(rad), y1=cy+rOut*Math.sin(rad);
    const x2=cx+(lit?70:rIn)*Math.cos(rad), y2=cy+(lit?70:rIn)*Math.sin(rad);
    const line=E(c,'line',{x1,y1,x2,y2,stroke:lit?'var(--led)':near?'#7a2b1f':'#41525A',
      'stroke-width':lit?3.4:principal?2.4:1.4,'stroke-linecap':'round'});
    if(lit)line.setAttribute('style','filter:drop-shadow(0 0 4px rgba(255,46,27,.8))');
  }
  [['N',0],['NO',45],['O',90],['ZO',135],['Z',180],['ZW',225],['W',270],['NW',315]].forEach(([txt,a])=>{
    const principal=(a%90===0), rad=(a-90)*Math.PI/180, r=58;
    const t=E(c,'text',{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)+(principal?6:5),'text-anchor':'middle',
      fill:principal?'#E7EDEF':'var(--label-dim)','font-family':'Barlow Semi Condensed','font-weight':600,
      'font-size':principal?18:13,'letter-spacing':'.08em'},txt);
  });
  E(c,'text',{x:cx,y:cy-3,'text-anchor':'middle',fill:'var(--led)','font-family':'Barlow Semi Condensed',
    'font-weight':700,'font-size':22,'letter-spacing':'.06em',style:'filter:drop-shadow(0 0 6px rgba(255,46,27,.5))'},'NO');
  E(c,'text',{x:cx,y:cy+16,'text-anchor':'middle',fill:'var(--label-dim)','font-family':'IBM Plex Mono','font-size':12},'45°');
})();

/* ---------- weer-glyph (gedeeld) ---------- */
function glyph(box,type,scale){
  scale=scale||1;
  const s=E(box,'svg',{viewBox:'0 0 32 24',style:`width:${26*scale}px;height:${20*scale}px`});
  const col='var(--label-dim)';
  const sun=(x,y,r)=>{E(s,'circle',{cx:x,cy:y,r,fill:'none',stroke:col,'stroke-width':1.5});
    for(let k=0;k<8;k++){const a=k*45*Math.PI/180;E(s,'line',{x1:x+(r+2)*Math.cos(a),y1:y+(r+2)*Math.sin(a),x2:x+(r+4)*Math.cos(a),y2:y+(r+4)*Math.sin(a),stroke:col,'stroke-width':1.3,'stroke-linecap':'round'});}};
  const cloud=(x,y)=>E(s,'path',{d:`M${x-8},${y+3} a5,5 0 0 1 3,-9 a6,6 0 0 1 11,2 a4.5,4.5 0 0 1 -1,7 Z`,fill:'none',stroke:col,'stroke-width':1.5,'stroke-linejoin':'round'});
  if(type==='sun')sun(16,12,5);
  else if(type==='cloud')cloud(16,11);
  else if(type==='suncloud'){sun(11,9,4);cloud(19,13);}
  else if(type==='rain'){cloud(16,8);[11,16,21].forEach(x=>E(s,'line',{x1:x,y1:17,x2:x-1.5,y2:22,stroke:'var(--water)','stroke-width':1.4,'stroke-linecap':'round'}));}
}

/* ---------- verloop van de dag (windgericht) ---------- */
(function(){
  const wk=document.getElementById('dayprog');
  function arrow(box,dir){
    const s=E(box,'svg',{viewBox:'0 0 24 24',style:'width:15px;height:15px'});
    const g=E(s,'g',{transform:`rotate(${dir+180} 12 12)`});
    E(g,'line',{x1:12,y1:5,x2:12,y2:19,stroke:'var(--label)','stroke-width':1.6,'stroke-linecap':'round'});
    E(g,'path',{d:'M8,9 L12,5 L16,9',fill:'none',stroke:'var(--label)','stroke-width':1.6,'stroke-linecap':'round','stroke-linejoin':'round'});
  }
  const hours=[
    {h:'nu',k:8,t:20,dir:45,now:true},{h:'09',k:9,t:18,dir:50},{h:'12',k:12,t:21,dir:60},
    {h:'15',k:13,t:22,dir:70},{h:'18',k:11,t:20,dir:80},{h:'21',k:9,t:17,dir:60},
    {h:'00',k:8,t:15,dir:45},{h:'03',k:7,t:14,dir:35}];
  hours.forEach(d=>{
    const col=document.createElement('div'); col.className='wd'+(d.now?' now':'');
    const day=document.createElement('div'); day.className='day'; day.textContent=d.h; col.appendChild(day);
    const ab=document.createElement('div'); ab.className='arr'; col.appendChild(ab); arrow(ab,d.dir);
    const kb=document.createElement('div'); kb.className='wk-big'; kb.textContent=d.k;
    const u=document.createElement('em'); u.textContent='kn'; kb.appendChild(u); col.appendChild(kb);
    const t=document.createElement('div'); t.className='t-dim'; t.textContent=d.t+'°'; col.appendChild(t);
    wk.appendChild(col);
  });
})();

/* ---------- getij over de dag (kentermomenten) ---------- */
(function(){
  const box=document.getElementById('tideday');
  const map=lvl=>40-((lvl+120)/240)*36;
  const evs=[
    {type:'HW',time:'09:40',lvl:100},{type:'LW',time:'16:50',lvl:-110},
    {type:'HW',time:'22:20',lvl:95},{type:'LW',time:'05:00',lvl:-100}];
  evs.forEach(e=>{
    const col=document.createElement('div'); col.className='wd';
    const day=document.createElement('div'); day.className='day'; day.textContent=e.type; col.appendChild(day);
    const gb=document.createElement('div'); col.appendChild(gb);
    const s=E(gb,'svg',{viewBox:'0 0 24 44',style:'width:18px;height:40px'});
    E(s,'line',{x1:12,y1:4,x2:12,y2:40,stroke:'var(--water-dim)','stroke-width':2,'stroke-linecap':'round'});
    const y=map(e.lvl);
    E(s,'line',{x1:12,y1:y,x2:12,y2:40,stroke:'var(--water)','stroke-width':4,'stroke-linecap':'round'});
    E(s,'circle',{cx:12,cy:y,r:3.4,fill:'var(--water-lit)',style:'filter:drop-shadow(0 0 3px rgba(63,144,173,.7))'});
    const t=document.createElement('div'); t.className='k'; t.textContent=e.time; col.appendChild(t);
    box.appendChild(col);
  });
})();

/* ---------- 7-daagse strip ---------- */
(function(){
  const wk=document.getElementById('week');
  const days=[
    {day:'do',w:'sun',t:21,k:12},{day:'vr',w:'suncloud',t:19,k:14},{day:'za',w:'cloud',t:18,k:10},
    {day:'zo',w:'sun',t:22,k:8},{day:'ma',w:'sun',t:23,k:9},{day:'di',w:'rain',t:17,k:16},{day:'wo',w:'suncloud',t:20,k:11}];
  days.forEach(d=>{
    const col=document.createElement('div'); col.className='wd';
    const day=document.createElement('div'); day.className='day'; day.textContent=d.day; col.appendChild(day);
    const gb=document.createElement('div'); col.appendChild(gb); glyph(gb,d.w);
    const t=document.createElement('div'); t.className='t'; t.textContent=d.t+'°'; col.appendChild(t);
    const k=document.createElement('div'); k.className='k'; k.textContent=d.k; 
    const u=document.createElement('span'); u.textContent='kn'; u.style.fontSize='9px'; k.appendChild(u); col.appendChild(k);
    wk.appendChild(col);
  });
})();
</script>
</body>
</html>
